<!doctype html>
<html><head><meta charset="utf-8"><title>Render fixture</title></head>
<body style="margin:0;font:16px system-ui;background:#fff;color:#111">
  <button id="go" style="position:absolute;left:100px;top:100px;width:160px;height:48px">Save</button>
  <div id="status" style="position:absolute;left:100px;top:180px">Loading…</div>
  <input id="secret" aria-label="Secret" style="position:absolute;left:100px;top:240px;width:200px;height:32px">
  <a id="next" href="/page2.html" style="position:absolute;left:100px;top:320px">Next</a>
  <script>
    // The app is slow on purpose: "Ready" after 3 s, "Saved" 2.5 s after a click.
    const status = document.getElementById('status');
    setTimeout(() => { if (status.textContent === 'Loading…') status.textContent = 'Ready'; }, 3000);
    document.getElementById('go').addEventListener('click', () => {
      status.textContent = 'Saving…';
      setTimeout(() => { status.textContent = 'Saved'; }, 2500);
    });
    // What reached the secret field, to check no real text ever did.
    document.getElementById('secret').addEventListener('input', (e) => { sessionStorage.setItem('secret-seen', (sessionStorage.getItem('secret-seen') || '') + '|' + e.target.value); });
  </script>
</body></html>
